<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>음료 주문 웹앱</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;color:#111827;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:24px 14px 70px}.narrow{max-width:560px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 26px #0f172a0b;margin-bottom:14px}.brand{font-size:12px;font-weight:900;letter-spacing:.12em;color:#4b5563}h1{font-size:27px;margin:4px 0 6px;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 12px}.muted{color:#6b7280;font-size:14px}.field{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field:focus{border-color:#111827;box-shadow:0 0 0 3px #11182712}label{display:block;font-size:14px;font-weight:800;margin:14px 0 7px}textarea.field{min-height:92px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;background:#f3f4f6;color:#111827}.btn.primary{background:#111827;color:#fff}.btn.danger{background:#fff1f2;color:#be123c}.btn:disabled{opacity:.45;cursor:not-allowed}.full{width:100%;margin-top:16px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.open{background:#ecfdf5;color:#047857}.closed{background:#f3f4f6;color:#4b5563}.notice{padding:11px 12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:14px;margin:12px 0}.error{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857}.rooms{display:grid;gap:10px}.room{border:1px solid #e5e7eb;border-radius:14px;padding:14px;background:#fff}.share{display:flex;gap:8px}.share input{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.stat small{color:#6b7280}.stat strong{display:block;font-size:24px;margin-top:2px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{padding:10px 0;border-bottom:1px solid #eee}.line:last-child{border-bottom:0}.summary{white-space:pre-wrap;background:#111827;color:#fff;padding:15px;border-radius:13px;line-height:1.65;font-size:14px}.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.temps button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px;font-weight:900}.temps button.on{background:#111827;color:#fff;border-color:#111827}.step{display:flex;gap:9px;margin-bottom:10px}.num{width:27px;height:27px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.complete{text-align:center;padding:20px 0}.complete .check{font-size:46px}.back{text-decoration:none;color:#6b7280;font-weight:800;font-size:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;transition:.2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.wrap{padding:16px 11px 60px}.grid2,.stats{grid-template-columns:1fr}.share{flex-direction:column}.share .btn{width:100%}.row.mobile{align-items:flex-start;flex-direction:column}.actions.mobile{width:100%}.actions.mobile .btn{flex:1}h1{font-size:23px}}
</style>
</head>
<body>
<div id="app"><div class="wrap narrow"><div class="card">불러오는 중...</div></div></div><div id="toast" class="toast"></div>
<script>
const SB='https://ewlimstjrleofteykqtm.supabase.co',KEY='sb_publishable_vb6Xgiw1b8ujrGzkKrvq5g_9RQlHqQr',ROOMS_KEY='drink-order-rooms-v2';
const app=document.getElementById('app'),toastEl=document.getElementById('toast');let toastTimer,currentAdminToken='';
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){clearTimeout(toastTimer);toastEl.textContent=s;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800)}
async function rpc(name,body={}){const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,authorization:`Bearer ${KEY}`,'content-type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||'처리 중 오류가 발생했습니다.');return d}
async function copy(s){try{await navigator.clipboard.writeText(s)}catch{const x=document.createElement('textarea');x.value=s;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('복사했습니다.')}
function base(){return location.origin+location.pathname}
function dt(v){if(!v)return'';return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}
function localDT(v){if(!v)return'';const d=new Date(v),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function savedRooms(){try{return JSON.parse(localStorage.getItem(ROOMS_KEY)||'[]')}catch{return[]}}
function saveRoom(r){const a=savedRooms().filter(x=>x.admin_token!==r.admin_token);a.unshift(r);localStorage.setItem(ROOMS_KEY,JSON.stringify(a.slice(0,30)))}
function removeSaved(token){localStorage.setItem(ROOMS_KEY,JSON.stringify(savedRooms().filter(x=>x.admin_token!==token)))}
function tempLabel(v){return v==='ICED'?'ICED':v==='NONE'?'':v}
function route(){const q=new URLSearchParams(location.search);return q.get('order')?['order',q.get('order')]:['home','']}
function goHome(){history.replaceState({},'',location.pathname);home()}

async function home(){currentAdminToken='';const saved=savedRooms();app.innerHTML=`<main class="wrap"><div class="brand">DRINK ORDER</div><h1>음료 주문 웹앱</h1><p class="muted">회원가입 없이 주문방을 만들고 주문자 링크만 공유하면 됩니다.</p><div class="grid2"><section class="card"><h2>새 주문방 만들기</h2><form id="createForm"><label for="roomTitle">주문 제목</label><input id="roomTitle" class="field" value="음료 주문" maxlength="80" required><label for="deadline">마감 시간 <span class="muted" style="font-weight:400">(선택)</span></label><input id="deadline" type="datetime-local" class="field"><button class="btn primary full" type="submit">주문방 만들기</button></form></section><section><h2>이 기기에서 만든 주문방</h2><div class="rooms">${saved.length?saved.map((r,i)=>`<article class="room"><div class="row between"><div><b>${esc(r.title||'음료 주문')}</b><div class="muted">${r.created_at?dt(r.created_at):''}</div></div><button class="btn primary" data-manage="${i}">관리</button></div></article>`).join(''):'<div class="card muted">아직 만든 주문방이 없습니다.</div>'}</div></section></div></main>`;
document.getElementById('createForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter,before=b.textContent;b.disabled=true;b.textContent='만드는 중...';try{const title=document.getElementById('roomTitle').value.trim()||'음료 주문',dl=document.getElementById('deadline').value,d=await rpc('coffee_create_room_simple',{p_title:title,p_deadline:dl?new Date(dl).toISOString():null});saveRoom({...d,title,created_at:new Date().toISOString()});await manage(d.admin_token)}catch(x){toast(x.message);b.disabled=false;b.textContent=before}});
document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{const r=savedRooms()[Number(b.dataset.manage)];if(r)manage(r.admin_token)});}

async function manage(token){currentAdminToken=token;let d;try{d=await rpc('coffee_admin_data_simple',{p_admin_token:token})}catch(e){removeSaved(token);app.innerHTML=`<main class="wrap narrow"><section class="card"><h2>주문방을 열 수 없습니다.</h2><div class="notice error">${esc(e.message)}</div><button class="btn" id="toHome">처음으로</button></section></main>`;document.getElementById('toHome').onclick=goHome;return}
const m=d.meeting,o=d.orders||[];saveRoom({admin_token:token,public_token:m.public_token,title:m.title,created_at:m.created_at});
const groups=new Map;for(const x of o){const t=tempLabel(x.temperature),k=(x.menu_name||'')+'|'+t;if(!groups.has(k))groups.set(k,{name:x.menu_name||'',temp:t,n:0});groups.get(k).n++}const g=[...groups.values()],publicLink=`${base()}?order=${m.public_token}`;const lines=[m.title,''];g.forEach(x=>lines.push(`${x.name}${x.temp?' '+x.temp:''} × ${x.n}`));const notes=o.filter(x=>x.note);if(notes.length){lines.push('','[추가 요구사항]');notes.forEach(x=>lines.push(`${x.customer_name} - ${x.menu_name}: ${x.note}`))}lines.push('',`총 ${o.length}잔`);const text=lines.join('\n');
app.innerHTML=`<main class="wrap"><button class="btn" id="toHome">← 주문방 목록</button><div class="row between mobile" style="margin-top:14px"><div><div class="brand">COLLECTOR</div><h1>${esc(m.title)}</h1><span class="badge ${m.status==='open'?'open':'closed'}">${m.status==='open'?'주문 접수중':'주문 마감'}</span>${m.deadline?` <span class="muted">· ${esc(dt(m.deadline))} 마감</span>`:''}</div><div class="actions mobile"><button id="refresh" class="btn">새로고침</button><button id="copyOrder" class="btn primary">주문복사</button><button id="toggle" class="btn ${m.status==='open'?'danger':''}">${m.status==='open'?'주문 마감':'주문 다시 열기'}</button></div></div><div class="stats"><div class="stat"><small>총 주문</small><strong>${o.length}잔</strong></div><div class="stat"><small>메뉴 종류</small><strong>${g.length}종</strong></div><div class="stat"><small>상태</small><strong>${m.status==='open'?'접수중':'마감'}</strong></div></div><section class="card"><h2>주문자에게 보낼 링크</h2><div class="share"><input class="field" readonly value="${esc(publicLink)}"><button id="copyPublic" class="btn primary">링크 복사</button><a class="btn" href="${esc(publicLink)}" target="_blank" style="text-decoration:none;text-align:center">주문 페이지 열기</a></div></section><section class="card"><h2>주문방 설정</h2><form id="settingsForm"><div class="grid2"><div><label for="setTitle">제목</label><input id="setTitle" class="field" value="${esc(m.title)}"></div><div><label for="setDeadline">마감 시간</label><input id="setDeadline" type="datetime-local" class="field" value="${esc(localDT(m.deadline))}"></div></div><button class="btn primary" style="margin-top:12px" type="submit">저장</button></form></section><div class="grid2"><section class="card"><h2>메뉴별 취합</h2>${g.length?g.map(x=>`<div class="line row between"><b>${esc(x.name)}${x.temp?' '+esc(x.temp):''}</b><strong>${x.n}잔</strong></div>`).join(''):'<div class="muted">아직 주문이 없습니다.</div>'}</section><section class="card"><h2>사람별 주문</h2>${o.length?o.map(x=>`<div class="line"><div class="row between"><b>${esc(x.customer_name)}</b><button class="btn danger" data-del="${x.id}" style="padding:6px 9px;font-size:12px">삭제</button></div><div>${esc(x.menu_name)}${x.temperature==='NONE'?'':' · '+esc(tempLabel(x.temperature))}</div>${x.note?`<div class="muted">요청: ${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="muted">아직 주문이 없습니다.</div>'}</section></div><section class="card"><h2>카페 전달용 주문내용</h2><div class="summary">${esc(text)}</div></section><section class="card"><button id="deleteRoom" class="btn danger">이 주문방 삭제</button></section></main>`;
document.getElementById('toHome').onclick=goHome;document.getElementById('refresh').onclick=()=>manage(token);document.getElementById('copyOrder').onclick=()=>copy(text);document.getElementById('copyPublic').onclick=()=>copy(publicLink);document.getElementById('toggle').onclick=async()=>{try{await rpc('coffee_admin_set_status',{p_admin_token:token,p_status:m.status==='open'?'closed':'open'});manage(token)}catch(e){toast(e.message)}};
document.getElementById('settingsForm').addEventListener('submit',async e=>{e.preventDefault();try{const title=document.getElementById('setTitle').value.trim(),dl=document.getElementById('setDeadline').value;await rpc('coffee_admin_update_room_simple',{p_admin_token:token,p_title:title,p_deadline:dl?new Date(dl).toISOString():null});toast('저장했습니다.');manage(token)}catch(x){toast(x.message)}});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('이 주문을 삭제할까요?'))return;try{await rpc('coffee_admin_delete_order',{p_admin_token:token,p_order_id:b.dataset.del});manage(token)}catch(x){toast(x.message)}});
document.getElementById('deleteRoom').onclick=async()=>{if(!confirm('주문방과 모든 주문을 삭제할까요?'))return;try{await rpc('coffee_admin_delete_room_simple',{p_admin_token:token});removeSaved(token);toast('삭제했습니다.');setTimeout(goHome,300)}catch(x){toast(x.message)}};}

async function orderPage(token){let page;try{page=await rpc('coffee_public_get_order_page_v4',{p_public_token:token})}catch(e){app.innerHTML=`<main class="wrap narrow"><section class="card"><h2>주문 페이지를 열 수 없습니다.</h2><div class="notice error">${esc(e.message)}</div></section></main>`;return}
const m=page.meeting,orderKey='drink-order-'+token;let mine=null,orderToken=localStorage.getItem(orderKey)||null;if(orderToken){try{mine=await rpc('coffee_public_get_my_order_v4',{p_public_token:token,p_order_token:orderToken});if(!mine){localStorage.removeItem(orderKey);orderToken=null}}catch{localStorage.removeItem(orderKey);orderToken=null}}
const closed=m.status!=='open'||(m.deadline&&Date.now()>new Date(m.deadline).getTime());let selectedTemp=mine?.temperature==='ICED'?'ICED':mine?.temperature||'';
app.innerHTML=`<main class="wrap narrow"><div class="brand">DRINK ORDER</div><h1>${esc(m.title)}</h1>${m.deadline?`<p class="muted">마감 ${esc(dt(m.deadline))}</p>`:''}<span class="badge ${closed?'closed':'open'}">${closed?'주문 마감':'주문 접수중'}</span>${mine?'<div class="notice">이 기기에 기존 주문이 있습니다. 다시 제출하면 기존 주문이 수정됩니다.</div>':''}<div id="formMsg"></div><form id="orderForm"><section class="card"><div class="step"><span class="num">1</span><div><b>이름</b><div class="muted">주문자 이름을 입력하세요.</div></div></div><input id="customerName" name="customerName" class="field" maxlength="30" autocomplete="name" value="${esc(mine?.customer_name||'')}" required ${closed?'disabled':''}></section><section class="card"><div class="step"><span class="num">2</span><div><b>음료</b><div class="muted">카페 메뉴명을 직접 입력하세요.</div></div></div><input id="menuName" name="menuName" class="field" maxlength="80" placeholder="예: 아메리카노, 딸기요거트스무디" value="${esc(mine?.menu_name||'')}" required ${closed?'disabled':''}></section><section class="card"><div class="step"><span class="num">3</span><div><b>HOT / ICED</b><div class="muted">해당하지 않으면 ‘해당 없음’을 선택하세요.</div></div></div><div class="temps"><button type="button" data-temp="HOT" ${closed?'disabled':''}>HOT</button><button type="button" data-temp="ICED" ${closed?'disabled':''}>ICED</button><button type="button" data-temp="NONE" ${closed?'disabled':''}>해당 없음</button></div></section><section class="card"><div class="step"><span class="num">4</span><div><b>추가 요구사항 <span class="muted">(선택)</span></b><div class="muted">연하게, 덜 달게, 얼음 적게 등</div></div></div><textarea id="orderNote" name="orderNote" class="field" maxlength="200" placeholder="예: 얼음 적게, 덜 달게" ${closed?'disabled':''}>${esc(mine?.note||'')}</textarea></section><button id="submitOrder" class="btn primary full" type="submit" ${closed?'disabled':''}>${mine?'주문 수정하기':'주문하기'}</button></form>${closed?'<div class="notice error">현재 주문이 마감되었습니다.</div>':''}</main>`;
function markTemp(){document.querySelectorAll('[data-temp]').forEach(b=>b.classList.toggle('on',b.dataset.temp===selectedTemp))}markTemp();document.querySelectorAll('[data-temp]').forEach(b=>b.onclick=()=>{selectedTemp=b.dataset.temp;markTemp()});
document.getElementById('orderForm').addEventListener('submit',async e=>{e.preventDefault();const nameEl=document.getElementById('customerName'),menuEl=document.getElementById('menuName'),noteEl=document.getElementById('orderNote'),msg=document.getElementById('formMsg'),btn=document.getElementById('submitOrder');const customerName=nameEl.value.trim(),menuName=menuEl.value.trim(),note=noteEl.value.trim();msg.innerHTML='';if(!customerName){msg.innerHTML='<div class="notice error">이름을 입력해 주세요.</div>';nameEl.focus();return}if(!menuName){msg.innerHTML='<div class="notice error">음료를 입력해 주세요.</div>';menuEl.focus();return}if(!selectedTemp){msg.innerHTML='<div class="notice error">HOT, ICED 또는 해당 없음을 선택해 주세요.</div>';return}btn.disabled=true;btn.textContent='처리 중...';try{const r=await rpc('coffee_public_submit_order_v4',{p_public_token:token,p_customer_name:customerName,p_menu_name:menuName,p_temperature:selectedTemp,p_note:note,p_order_token:orderToken});orderToken=r.order_token;localStorage.setItem(orderKey,orderToken);app.innerHTML=`<main class="wrap narrow"><div class="brand">DRINK ORDER</div><h1>${esc(m.title)}</h1><section class="card complete"><div class="check">✓</div><h2>주문이 접수되었습니다</h2><p><b>${esc(customerName)}</b> · ${esc(menuName)}${selectedTemp==='NONE'?'':' · '+esc(selectedTemp)}</p>${note?`<p class="muted">요청: ${esc(note)}</p>`:''}<button id="editOrder" class="btn primary" style="margin-top:12px">내 주문 수정하기</button></section></main>`;document.getElementById('editOrder').onclick=()=>orderPage(token)}catch(x){msg.innerHTML=`<div class="notice error">${esc(x.message)}</div>`;btn.disabled=false;btn.textContent=mine?'주문 수정하기':'주문하기'}});}

async function boot(){const [r,v]=route();if(r==='order')return orderPage(v);home()}
boot();
</script>
</body>
</html>
