<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827">
<title>음료 주문 취합</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;color:#111827;background:#f5f6f8}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}.wrap{max-width:1060px;margin:auto;padding:26px 16px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}h1{font-size:26px;margin:0}h2{font-size:19px}.muted{color:#6b7280}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(15,23,42,.04)}.auth,.public-card{max-width:500px;margin:5vh auto}.tabs,.seg{display:flex;background:#f3f4f6;border-radius:12px;padding:4px;gap:4px}.tab,.seg button{flex:1;border:0;background:transparent;padding:11px;border-radius:9px;cursor:pointer;font-weight:700}.tab.active,.seg button.active{background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.1)}label{display:block;font-size:14px;font-weight:800;margin:14px 0 7px}.field{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;background:#fff;outline:none}.field:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}textarea.field{resize:vertical;min-height:88px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.ghost{background:#f3f4f6;color:#111827}.danger{background:#fff1f2;color:#be123c}.success{background:#ecfdf5;color:#047857}.full{width:100%;margin-top:16px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:340px 1fr;gap:18px}.stack{display:grid;gap:13px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.room{border:1px solid #e5e7eb;border-radius:14px;padding:14px;cursor:pointer}.room:hover,.room.active{border-color:#111827;background:#f9fafb}.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.open{background:#ecfdf5;color:#047857}.closed{background:#f3f4f6;color:#4b5563}.count{font-size:34px;font-weight:900}.share{display:flex;gap:8px}.share input{flex:1;min-width:0}.orders{display:grid;gap:9px;margin-top:14px}.order{display:grid;grid-template-columns:115px 1.25fr 78px 1.4fr auto;gap:10px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.order.head{font-size:12px;color:#6b7280;background:#f9fafb}.temp{font-weight:900}.hot{color:#b45309}.ice{color:#0369a1}.empty{text-align:center;padding:32px 8px;color:#6b7280}.notice{padding:12px;border-radius:11px;margin:12px 0;font-size:14px}.err{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857}.summary{background:#f9fafb;border-radius:14px;padding:15px;margin-top:14px;line-height:1.7}.deadline{margin:8px 0 18px;font-size:14px}.public-card h1{font-size:24px}.logo{font-size:38px;margin-bottom:8px}
@media(max-width:820px){.wrap{padding:16px 12px 42px}.grid{grid-template-columns:1fr}.top h1{font-size:22px}.order.head{display:none}.order{grid-template-columns:1fr auto}.order .menu,.order .note{grid-column:1/-1}.order .name{font-weight:900}.order .delete{grid-row:1;grid-column:2}.share{flex-direction:column}.share .btn{width:100%}.count{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
<section id="publicView" class="hidden"><div class="card public-card"><div class="logo">☕</div><h1 id="publicTitle">음료 주문</h1><div id="publicDeadline" class="deadline muted"></div><div id="publicMsg"></div><form id="orderForm"><label>이름</label><input id="customerName" class="field" maxlength="30" placeholder="이름을 입력하세요" required><label>음료 메뉴</label><input id="menuName" class="field" maxlength="80" placeholder="예: 아메리카노" required><label>HOT / ICE</label><div class="seg"><button type="button" id="hotBtn">HOT</button><button type="button" id="iceBtn">ICE</button></div><label>세부 요청사항 <span class="muted" style="font-weight:400">(선택)</span></label><textarea id="note" class="field" maxlength="200" placeholder="예: 얼음 적게, 샷 추가"></textarea><button id="submitOrder" class="btn primary full">주문 제출</button></form><div id="orderSummary"></div></div></section>

<section id="auth" class="card auth hidden"><h1>☕ 음료 주문 취합</h1><p class="muted">취합자만 로그인합니다. 주문자는 공유링크로 바로 주문합니다.</p><div class="tabs"><button id="loginTab" class="tab active">로그인</button><button id="signupTab" class="tab">회원가입</button></div><div id="authMsg"></div><form id="loginForm"><label>아이디</label><input id="loginUser" class="field" autocomplete="username" required><label>비밀번호</label><input id="loginPass" class="field" type="password" autocomplete="current-password" required><button class="btn primary full">로그인</button></form><form id="signupForm" class="hidden"><label>표시 이름</label><input id="signupName" class="field" maxlength="30" placeholder="예: 남의태"><label>아이디</label><input id="signupUser" class="field" maxlength="30" required><label>비밀번호</label><input id="signupPass" class="field" type="password" minlength="6" required><button class="btn primary full">회원가입</button></form></section>

<section id="app" class="hidden"><div class="top"><div><h1>☕ 음료 주문 취합</h1><div id="hello" class="muted"></div></div><button id="logoutBtn" class="btn ghost">로그아웃</button></div><div class="grid"><div class="stack"><div class="card"><h2 style="margin-top:0">새 주문방</h2><form id="createForm"><label>주문 제목</label><input id="roomTitle" class="field" maxlength="80" placeholder="예: 8월 12일 음료 주문" required><label>마감시간 <span class="muted" style="font-weight:400">(선택)</span></label><input id="deadline" class="field" type="datetime-local"><button class="btn primary full">주문방 만들기</button></form></div><div class="card"><div class="row between"><h2 style="margin:0">내 주문방</h2><button id="refreshRooms" class="btn ghost">새로고침</button></div><div id="rooms" class="stack" style="margin-top:14px"></div></div></div><div id="detail" class="card"><div class="empty">왼쪽에서 주문방을 선택하세요.</div></div></div></section>
</div>
<script>
const SUPABASE_URL='https://ewlimstjrleofteykqtm.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3bGltc3Rqcmxlb2Z0ZXlrcXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNzk0NjUsImV4cCI6MjEwMTg1NTQ2NX0.Rkf1IN2bs2MIOIZUKmjEkygZZbKlMXo7eesSri5rmX8';
const SESSION_KEY='coffee_admin_session_v4';let session=localStorage.getItem(SESSION_KEY)||'',currentMeeting=null,refreshTimer=null,temperature='';
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function rpc(name,body){const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:ANON,Authorization:`Bearer ${ANON}`,'Content-Type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.message||d?.error_description||String(d)||'요청에 실패했습니다.');return d}
function msg(el,text,type='err'){el.innerHTML=text?`<div class="notice ${type}">${esc(text)}</div>`:''}
const orderToken=new URLSearchParams(location.search).get('order');
if(orderToken){initPublic(orderToken)}else{initAdmin()}

async function initPublic(token){$('#publicView').classList.remove('hidden');try{const d=await rpc('coffee_public_get_order_page_v4',{p_public_token:token}),m=d.meeting;$('#publicTitle').textContent=m.title;document.title=m.title;$('#publicDeadline').textContent=m.deadline?'마감: '+new Date(m.deadline).toLocaleString('ko-KR'):'마감시간 없음';if(m.status!=='open'||(m.deadline&&Date.now()>new Date(m.deadline).getTime())){msg($('#publicMsg'),'주문이 마감되었습니다.');disableOrder();return}const saved=localStorage.getItem('coffee_order_'+token);if(saved){try{const mine=await rpc('coffee_public_get_my_order_v4',{p_public_token:token,p_order_token:saved});if(mine){$('#customerName').value=mine.customer_name;$('#menuName').value=mine.menu_name;$('#note').value=mine.note||'';setTemp(mine.temperature);showSummary(mine,true)}}catch{}}$('#hotBtn').onclick=()=>setTemp('HOT');$('#iceBtn').onclick=()=>setTemp('ICE');$('#orderForm').onsubmit=e=>submitPublic(e,token)}catch(err){msg($('#publicMsg'),err.message);disableOrder()}}
function setTemp(v){temperature=v;$('#hotBtn').classList.toggle('active',v==='HOT');$('#iceBtn').classList.toggle('active',v==='ICE')}
function disableOrder(){document.querySelectorAll('#orderForm input,#orderForm textarea,#orderForm button').forEach(x=>x.disabled=true)}
async function submitPublic(e,token){e.preventDefault();if(!temperature){msg($('#publicMsg'),'HOT 또는 ICE를 선택해 주세요.');return}const b=$('#submitOrder');b.disabled=true;msg($('#publicMsg'),'');try{const saved=localStorage.getItem('coffee_order_'+token);const out=await rpc('coffee_public_submit_order_v4',{p_public_token:token,p_customer_name:$('#customerName').value,p_menu_name:$('#menuName').value,p_temperature:temperature,p_note:$('#note').value,p_order_token:saved||null});localStorage.setItem('coffee_order_'+token,out.order_token);msg($('#publicMsg'),saved?'주문이 수정되었습니다.':'주문이 접수되었습니다.','ok');showSummary({customer_name:$('#customerName').value,menu_name:$('#menuName').value,temperature,note:$('#note').value},false);b.textContent='주문 수정하기'}catch(err){msg($('#publicMsg'),err.message)}finally{b.disabled=false}}
function showSummary(o,existing){$('#orderSummary').innerHTML=`<div class="summary"><strong>${existing?'내 주문':'주문 완료'}</strong><br>${esc(o.customer_name)} · ${esc(o.menu_name)} · <b>${esc(o.temperature)}</b>${o.note?'<br>요청: '+esc(o.note):''}<div class="muted" style="margin-top:5px;font-size:13px">아래 입력내용을 바꾸고 ‘주문 수정하기’를 누르면 수정됩니다.</div></div>`;$('#submitOrder').textContent='주문 수정하기'}

function initAdmin(){$('#auth').classList.remove('hidden');$('#loginTab').onclick=()=>setTabs(false);$('#signupTab').onclick=()=>setTabs(true);$('#loginForm').onsubmit=login;$('#signupForm').onsubmit=signup;$('#logoutBtn').onclick=logout;$('#createForm').onsubmit=createRoom;$('#refreshRooms').onclick=()=>loadRooms(currentMeeting?.id);if(session)startApp()}
function setTabs(signup){$('#loginTab').classList.toggle('active',!signup);$('#signupTab').classList.toggle('active',signup);$('#loginForm').classList.toggle('hidden',signup);$('#signupForm').classList.toggle('hidden',!signup);msg($('#authMsg'),'')}
async function login(e){e.preventDefault();try{const d=await rpc('coffee_admin_login',{p_username:$('#loginUser').value,p_password:$('#loginPass').value});session=d.session_token;localStorage.setItem(SESSION_KEY,session);await startApp()}catch(err){msg($('#authMsg'),err.message)}}
async function signup(e){e.preventDefault();try{const d=await rpc('coffee_admin_signup',{p_username:$('#signupUser').value,p_password:$('#signupPass').value,p_display_name:$('#signupName').value});session=d.session_token;localStorage.setItem(SESSION_KEY,session);await startApp()}catch(err){msg($('#authMsg'),err.message)}}
async function logout(){try{await rpc('coffee_admin_logout',{p_session_token:session})}catch{}localStorage.removeItem(SESSION_KEY);location.reload()}
async function startApp(){try{const me=await rpc('coffee_admin_me',{p_session_token:session});$('#hello').textContent=`${me.display_name}님의 주문방`;$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await loadRooms()}catch{localStorage.removeItem(SESSION_KEY);session='';$('#auth').classList.remove('hidden');$('#app').classList.add('hidden')}}
async function createRoom(e){e.preventDefault();const b=e.submitter;b.disabled=true;try{const dl=$('#deadline').value?new Date($('#deadline').value).toISOString():null;const room=await rpc('coffee_admin_create_meeting_v4',{p_session_token:session,p_title:$('#roomTitle').value,p_deadline:dl});$('#roomTitle').value='';$('#deadline').value='';await loadRooms(room.id)}catch(err){alert(err.message)}finally{b.disabled=false}}
async function loadRooms(selectId){const list=await rpc('coffee_admin_list_meetings_v3',{p_session_token:session});const el=$('#rooms');if(!list.length){el.innerHTML='<div class="empty">아직 주문방이 없습니다.</div>';$('#detail').innerHTML='<div class="empty">새 주문방을 만들어 공유해 보세요.</div>';return}el.innerHTML=list.map(r=>`<div class="room ${currentMeeting?.id===r.id?'active':''}" data-id="${r.id}"><div class="row between"><strong>${esc(r.title)}</strong><span class="badge ${r.status==='open'?'open':'closed'}">${r.status==='open'?'주문중':'마감'}</span></div><div class="muted" style="margin-top:7px">주문 ${r.order_count}명${r.deadline?' · '+new Date(r.deadline).toLocaleString('ko-KR'):''}</div></div>`).join('');el.querySelectorAll('.room').forEach(x=>x.onclick=()=>openRoom(x.dataset.id));if(selectId)await openRoom(selectId);else if(currentMeeting)await openRoom(currentMeeting.id)}
async function openRoom(id){try{const d=await rpc('coffee_admin_dashboard_v4',{p_session_token:session,p_meeting_id:id});currentMeeting=d.meeting;renderDetail(d);document.querySelectorAll('.room').forEach(x=>x.classList.toggle('active',x.dataset.id===id));clearInterval(refreshTimer);refreshTimer=setInterval(()=>silentRefresh(id),5000)}catch(err){alert(err.message)}}
async function silentRefresh(id){if(!currentMeeting||currentMeeting.id!==id)return;try{const d=await rpc('coffee_admin_dashboard_v4',{p_session_token:session,p_meeting_id:id});currentMeeting=d.meeting;renderDetail(d)}catch{}}
function renderDetail(d){const m=d.meeting,orders=d.orders||[],link=`${location.origin}/?order=${m.public_token}`;$('#detail').innerHTML=`<div class="row between"><div><div class="row"><h2 style="margin:0;font-size:22px">${esc(m.title)}</h2><span class="badge ${m.status==='open'?'open':'closed'}">${m.status==='open'?'주문중':'마감'}</span></div><div class="muted" style="margin-top:6px">${m.deadline?'마감 '+new Date(m.deadline).toLocaleString('ko-KR'):'마감시간 없음'}</div></div><div class="count">${orders.length}<span style="font-size:15px;font-weight:600">명</span></div></div><label>주문자 공유링크</label><div class="share"><input id="shareLink" class="field" value="${esc(link)}" readonly><button id="copyBtn" class="btn primary">링크 복사</button></div><div class="row" style="margin-top:12px"><button id="toggleStatus" class="btn ${m.status==='open'?'danger':'success'}">${m.status==='open'?'주문 마감':'다시 열기'}</button><button id="deleteRoom" class="btn ghost">주문방 삭제</button><button id="refreshDetail" class="btn ghost">새로고침</button></div><div class="orders">${orders.length?'<div class="order head"><span>이름</span><span>음료 메뉴</span><span>HOT/ICE</span><span>세부 요청사항</span><span></span></div>':''}${orders.map(o=>`<div class="order"><span class="name">${esc(o.customer_name)}</span><span class="menu">${esc(o.menu_name)}</span><span class="temp ${o.temperature==='HOT'?'hot':'ice'}">${o.temperature==='HOT'?'HOT':'ICE'}</span><span class="note">${esc(o.note||'-')}</span><button class="btn ghost delete" data-order="${o.id}">삭제</button></div>`).join('')}${orders.length?'':'<div class="empty">아직 들어온 주문이 없습니다.</div>'}</div>`;$('#copyBtn').onclick=()=>copyText(link);$('#toggleStatus').onclick=()=>toggleStatus(m);$('#deleteRoom').onclick=()=>deleteRoom(m);$('#refreshDetail').onclick=()=>openRoom(m.id);document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>deleteOrder(m.id,b.dataset.order))}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{const i=$('#shareLink');i.select();document.execCommand('copy')}alert('공유링크를 복사했습니다.')}
async function toggleStatus(m){try{await rpc('coffee_admin_set_status_v3',{p_session_token:session,p_meeting_id:m.id,p_status:m.status==='open'?'closed':'open'});await openRoom(m.id);await loadRooms()}catch(err){alert(err.message)}}
async function deleteOrder(meetingId,orderId){if(!confirm('이 주문을 삭제할까요?'))return;try{await rpc('coffee_admin_delete_order_v3',{p_session_token:session,p_meeting_id:meetingId,p_order_id:orderId});await openRoom(meetingId);await loadRooms()}catch(err){alert(err.message)}}
async function deleteRoom(m){if(!confirm(`'${m.title}' 주문방을 삭제할까요? 주문 내역도 함께 삭제됩니다.`))return;try{await rpc('coffee_admin_delete_meeting_v3',{p_session_token:session,p_meeting_id:m.id});currentMeeting=null;clearInterval(refreshTimer);await loadRooms()}catch(err){alert(err.message)}}
</script>
</body>
</html>
