<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1ea"><title>용소초 왓커피 음료 주문</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdfa;--ink:#1f2923;--muted:#6f7772;--line:#dfd8ce;--g:#315542;--gs:#e8efe9;--red:#a34540;--reds:#f5e7e4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;line-height:1.5}button,input,textarea,select{font:inherit}.wrap{max-width:980px;margin:auto;padding:22px 15px 70px}.narrow{max-width:690px}.brand{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--g)}h1{font-size:27px;margin:5px 0 5px;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 12px}.sub{font-size:14px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin:13px 0;box-shadow:0 8px 24px #1f29230d}.field{display:block;margin:12px 0}.field b{display:block;font-size:13px;margin-bottom:5px}.input,.ta,.sel{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);outline:none}.ta{min-height:90px;resize:vertical}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:white;color:var(--ink);font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);border-color:var(--g);color:#fff}.danger{background:var(--reds);border-color:#ead0cd;color:var(--red)}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:22px}.notice{padding:12px 13px;border-radius:12px;background:var(--gs);color:#284936;margin:12px 0;font-size:14px}.notice.red{background:var(--reds);color:#793a36}.badge{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--gs);color:var(--g);font-size:12px;font-weight:900}.badge.closed{background:var(--reds);color:var(--red)}.step{display:flex;gap:9px;margin-bottom:11px}.num{width:28px;height:28px;border-radius:8px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.segment{display:grid;grid-template-columns:1fr 1fr;gap:8px}.segment button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:900}.segment button.on{background:var(--g);border-color:var(--g);color:#fff}.segment button:disabled{opacity:.35}.sum,.person{padding:10px 0;border-bottom:1px solid var(--line)}.sum:last-child,.person:last-child{border-bottom:0}.pre{white-space:pre-wrap;background:#202822;color:#f7f3eb;padding:14px;border-radius:12px;font-family:ui-monospace,monospace;font-size:13px}.recent{display:grid;gap:8px;margin-top:10px}.recent a{display:block;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink);text-decoration:none;font-weight:800}.loading{text-align:center;padding:70px 20px;color:var(--muted)}.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 25%);padding-top:22px}.sticky .btn{width:100%;padding:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#202822;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;transition:.2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}.row.mobile{align-items:flex-start;flex-direction:column}.actions.mobile{width:100%}.actions.mobile>*{flex:1}h1{font-size:23px}}
</style></head><body><div id="app"><div class="loading">불러오는 중...</div></div><div id="toast" class="toast"></div>
<script>
const SB='https://ewlimstjrleofteykqtm.supabase.co',KEY='sb_publishable_vb6Xgiw1b8ujrGzkKrvq5g_9RQlHqQr';const app=document.getElementById('app'),toastEl=document.getElementById('toast');let tt;function toast(s){clearTimeout(tt);toastEl.textContent=s;toastEl.classList.add('show');tt=setTimeout(()=>toastEl.classList.remove('show'),2000)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function rpc(name,body={}){const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{'content-type':'application/json',apikey:KEY,authorization:`Bearer ${KEY}`},body:JSON.stringify(body)}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||'처리 중 오류가 발생했습니다.');return d}async function copy(s){try{await navigator.clipboard.writeText(s)}catch{const x=document.createElement('textarea');x.value=s;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('복사했습니다.')}function base(){return location.origin+location.pathname}function dt(v){return v?new Date(v).toLocaleString('ko-KR'):''}function local(v){if(!v)return'';const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}function route(){const q=new URLSearchParams(location.search);return q.get('order')?['order',q.get('order')]:q.get('admin')?['admin',q.get('admin')]:['home','']}function go(q=''){location.href=base()+q}function recent(){try{return JSON.parse(localStorage.getItem('yswc_recent')||'[]')}catch{return[]}}function saveRecent(x){let a=recent().filter(v=>v.admin!==x.admin);a.unshift(x);localStorage.setItem('yswc_recent',JSON.stringify(a.slice(0,8)))}
async function boot(){app.innerHTML='<div class="loading">불러오는 중...</div>';try{const[r,t]=route();if(r==='order')return orderPage(t);if(r==='admin')return adminPage(t);home()}catch(e){app.innerHTML=`<main class="wrap narrow"><section class="card"><h2>오류</h2><div class="notice red">${esc(e.message)}</div><a class="btn" href="${base()}">처음으로</a></section></main>`}}window.addEventListener('popstate',boot);
function home(){const rs=recent();app.innerHTML=`<main class="wrap narrow"><div class="brand">YONGSO · WHAT COFFEE</div><h1>용소초 왓커피 음료 주문</h1><p class="sub">회원가입 없이 주문방을 만들고, 생성된 주문 링크만 공유하면 됩니다.</p><section class="card"><h2>새 주문방 만들기</h2><form id="make"><label class="field"><b>주문 제목</b><input id="title" class="input" value="부장회의 음료 주문" maxlength="80" required></label><label class="field"><b>마감 시간 (선택)</b><input id="deadline" class="input" type="datetime-local"></label><button class="btn primary" style="width:100%;padding:14px">주문방 만들기</button></form></section><div class="notice">주문방을 만들면 <b>취합자용 링크</b>와 <b>주문자용 링크</b>가 각각 생깁니다. 취합자용 링크만 본인이 보관하면 됩니다.</div>${rs.length?`<section class="card"><h2>이 기기에서 만든 주문방</h2><div class="recent">${rs.map(x=>`<a href="${base()}?admin=${esc(x.admin)}">${esc(x.title)}<div class="sub">취합 화면 열기</div></a>`).join('')}</div></section>`:''}</main>`;document.getElementById('make').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const d=await rpc('coffee_create_room_simple',{p_title:title.value.trim(),p_deadline:deadline.value?new Date(deadline.value).toISOString():null});saveRecent({title:d.title,admin:d.admin_token,public:d.public_token});go('?admin='+d.admin_token)}catch(x){toast(x.message);b.disabled=false}}}
async function adminPage(token){let d=await rpc('coffee_admin_data',{p_admin_token:token});const draw=()=>{const m=d.meeting,o=d.orders||[],mp=new Map;for(const x of o){const k=x.menu_name+'|'+x.temperature;if(!mp.has(k))mp.set(k,{name:x.menu_name,temp:x.temperature,n:0});mp.get(k).n++}const sums=[...mp.values()],orderUrl=`${base()}?order=${m.public_token}`,adminUrl=`${base()}?admin=${token}`;let lines=[m.title,'송천동 왓커피',''];sums.forEach(x=>lines.push(`${x.name}${x.temp==='NONE'?'':' '+x.temp} × ${x.n}`));const notes=o.filter(x=>x.note);if(notes.length){lines.push('','[추가 요구사항]');notes.forEach(x=>lines.push(`${x.customer_name} - ${x.menu_name}: ${x.note}`))}lines.push('',`총 ${o.length}잔`);const txt=lines.join('\n');app.innerHTML=`<main class="wrap"><a class="btn" href="${base()}" style="margin-bottom:10px">← 새 주문방 만들기</a><div class="row between mobile"><div><div class="brand">취합자 화면</div><h1>${esc(m.title)}</h1><p class="sub">송천동 왓커피${m.deadline?' · 마감 '+esc(dt(m.deadline)):''}</p><span class="badge ${m.status==='closed'?'closed':''}">${m.status==='closed'?'주문 마감':'주문 접수중'}</span></div><div class="actions mobile"><button id="refresh" class="btn">새로고침</button><button id="copyorder" class="btn primary">주문복사</button><button id="toggle" class="btn ${m.status==='open'?'danger':''}">${m.status==='open'?'주문 마감':'주문 다시 열기'}</button></div></div><div class="grid3"><div class="stat"><small>총 주문</small><strong>${o.length}잔</strong></div><div class="stat"><small>메뉴 종류</small><strong>${sums.length}종</strong></div><div class="stat"><small>상태</small><strong>${m.status==='open'?'접수중':'마감'}</strong></div></div><section class="card"><h2>주문자에게 보낼 링크</h2><div class="row mobile"><input class="input" value="${esc(orderUrl)}" readonly><button id="copylink" class="btn primary">링크 복사</button><a class="btn" href="${esc(orderUrl)}" target="_blank">주문 페이지 열기</a></div></section><section class="card"><h2>내 취합자용 링크</h2><div class="row mobile"><input class="input" value="${esc(adminUrl)}" readonly><button id="copyadmin" class="btn">내 링크 복사</button></div><p class="sub">회원가입 대신 이 링크가 관리자 열쇠입니다. 다른 사람에게 공유하지 마세요.</p></section><section class="card"><h2>주문방 설정</h2><form id="settings"><div class="grid2"><label class="field"><b>제목</b><input id="st" class="input" value="${esc(m.title)}"></label><label class="field"><b>마감 시간</b><input id="sd" class="input" type="datetime-local" value="${esc(local(m.deadline))}"></label></div><button class="btn primary">설정 저장</button></form></section><div class="grid2"><section class="card"><h2>메뉴별 취합</h2>${sums.length?sums.map(x=>`<div class="sum row between"><b>${esc(x.name)} ${x.temp==='NONE'?'':esc(x.temp)}</b><strong>${x.n}잔</strong></div>`).join(''):'<p class="sub">아직 주문이 없습니다.</p>'}</section><section class="card"><h2>사람별 주문</h2>${o.length?o.map(x=>`<div class="person"><b>${esc(x.customer_name)}</b><div class="sub">${esc(x.menu_name)} ${x.temperature==='NONE'?'':esc(x.temperature)}</div>${x.note?`<div>${esc(x.note)}</div>`:''}<button class="btn danger" style="margin-top:6px;padding:7px 9px;font-size:12px" data-del="${x.id}">삭제</button></div>`).join(''):'<p class="sub">아직 주문이 없습니다.</p>'}</section></div><section class="card"><h2>카페 전달용</h2><div class="pre">${esc(txt)}</div></section><section class="card"><button id="deleteRoom" class="btn danger">주문방 삭제</button></section></main>`;refresh.onclick=async()=>{d=await rpc('coffee_admin_data',{p_admin_token:token});draw();toast('새로고침했습니다.')};copyorder.onclick=()=>copy(txt);copylink.onclick=()=>copy(orderUrl);copyadmin.onclick=()=>copy(adminUrl);toggle.onclick=async()=>{await rpc('coffee_admin_set_status',{p_admin_token:token,p_status:m.status==='open'?'closed':'open'});d=await rpc('coffee_admin_data',{p_admin_token:token});draw()};settings.onsubmit=async e=>{e.preventDefault();await rpc('coffee_admin_update_settings',{p_admin_token:token,p_title:st.value.trim(),p_cafe_name:'송천동 왓커피',p_deadline:sd.value?new Date(sd.value).toISOString():null});d=await rpc('coffee_admin_data',{p_admin_token:token});saveRecent({title:d.meeting.title,admin:token,public:d.meeting.public_token});draw();toast('저장했습니다.')};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('이 주문을 삭제할까요?'))return;await rpc('coffee_admin_delete_order',{p_admin_token:token,p_order_id:b.dataset.del});d=await rpc('coffee_admin_data',{p_admin_token:token});draw()});deleteRoom.onclick=async()=>{if(!confirm('주문방과 모든 주문을 삭제할까요?'))return;await rpc('coffee_admin_delete_room_simple',{p_admin_token:token});let a=recent().filter(x=>x.admin!==token);localStorage.setItem('yswc_recent',JSON.stringify(a));go()}};draw();setInterval(async()=>{try{d=await rpc('coffee_admin_data',{p_admin_token:token});draw()}catch{}},15000)}
async function orderPage(token){const p=await rpc('coffee_public_get_order_page_v3',{p_public_token:token}),m=p.meeting,menu=p.menu||[],lk='yswc_order_'+token;let mine=null,ot=localStorage.getItem(lk);if(ot)try{mine=await rpc('coffee_public_get_my_order_v3',{p_public_token:token,p_order_token:ot})}catch{}let state={name:mine?.customer_name||'',menu:mine?.menu_item_id||'',temp:mine?.temperature||'',note:mine?.note||'',done:false};const selected=()=>menu.find(x=>String(x.id)===String(state.menu));const closed=()=>m.status!=='open'||(m.deadline&&new Date()>new Date(m.deadline));const draw=()=>{if(state.done){app.innerHTML=`<main class="wrap narrow"><div class="brand">YONGSO · WHAT COFFEE</div><h1>${esc(m.title)}</h1><section class="card" style="text-align:center"><div style="font-size:42px">✓</div><h2>주문이 접수되었습니다</h2><p class="sub">${esc(state.name)} 선생님의 주문을 저장했습니다.</p><button id="edit" class="btn primary">내 주문 수정하기</button></section></main>`;edit.onclick=()=>{state.done=false;draw()};return}const x=selected(),cl=closed();const groups=[...new Set(menu.map(y=>y.category))];app.innerHTML=`<main class="wrap narrow"><div class="brand">YONGSO · WHAT COFFEE</div><h1>${esc(m.title)}</h1><p class="sub">송천동 왓커피${m.deadline?' · 마감 '+esc(dt(m.deadline)):''}</p><span class="badge ${cl?'closed':''}">${cl?'주문 마감':'주문 접수중'}</span>${mine?'<div class="notice">이 기기에 기존 주문이 있습니다. 다시 제출하면 수정됩니다.</div>':''}${cl?'<div class="notice red">현재 주문이 마감되었습니다.</div>':''}<section class="card"><div class="step"><span class="num">1</span><div><b>이름</b><div class="sub">주문자 이름을 입력하세요.</div></div></div><input id="on" class="input" maxlength="30" value="${esc(state.name)}" ${cl?'disabled':''}></section><section class="card"><div class="step"><span class="num">2</span><div><b>메뉴 선택</b><div class="sub">금액 없이 메뉴 이름만 표시됩니다.</div></div></div><select id="menuSel" class="sel" ${cl?'disabled':''}><option value="">메뉴를 선택하세요</option>${groups.map(g=>`<optgroup label="${esc(g==='COFFEE'?'커피':g==='BEVERAGE'?'음료':g==='ADE'?'에이드':g==='TEA'?'티':g==='JUICE'?'주스':g)}">${menu.filter(y=>y.category===g).map(y=>`<option value="${y.id}" ${String(state.menu)===String(y.id)?'selected':''}>${esc(y.name)}</option>`).join('')}</optgroup>`).join('')}</select></section><section class="card"><div class="step"><span class="num">3</span><div><b>HOT / ICED</b><div class="sub">${x?esc(x.name)+' 온도를 선택하세요.':'먼저 메뉴를 선택하세요.'}</div></div></div><div class="segment"><button id="hot" class="${state.temp==='HOT'?'on':''}" ${(!x||cl||x.temperature==='iced'||x.temperature==='none')?'disabled':''}>HOT</button><button id="ice" class="${state.temp==='ICED'?'on':''}" ${(!x||cl||x.temperature==='hot'||x.temperature==='none')?'disabled':''}>ICED</button></div></section><section class="card"><div class="step"><span class="num">4</span><div><b>추가 요구사항 (선택)</b><div class="sub">연하게, 덜 달게, 얼음 적게 등</div></div></div><textarea id="note" class="ta" maxlength="200" placeholder="예: 연하게, 덜 달게, 얼음 적게" ${cl?'disabled':''}>${esc(state.note)}</textarea></section><div class="sticky"><button id="submit" class="btn primary" ${cl?'disabled':''}>${mine?'주문 수정하기':'주문하기'}</button></div></main>`;on.oninput=e=>state.name=e.target.value;menuSel.onchange=e=>{state.menu=e.target.value;const y=selected();state.temp=y?.temperature==='hot'?'HOT':y?.temperature==='iced'?'ICED':y?.temperature==='none'?'NONE':'';draw()};hot.onclick=()=>{state.temp='HOT';draw()};ice.onclick=()=>{state.temp='ICED';draw()};note.oninput=e=>state.note=e.target.value;submit.onclick=async()=>{if(!state.name.trim()){toast('이름을 입력해 주세요.');return}if(!selected()){toast('메뉴를 선택해 주세요.');return}if(!state.temp){toast('HOT 또는 ICED를 선택해 주세요.');return}submit.disabled=true;try{const r=await rpc('coffee_public_submit_order_v3',{p_public_token:token,p_customer_name:state.name.trim(),p_menu_item_id:Number(state.menu),p_temperature:state.temp,p_note:state.note.trim(),p_order_token:ot||null});ot=r.order_token;localStorage.setItem(lk,ot);mine={customer_name:state.name,menu_item_id:Number(state.menu),temperature:state.temp,note:state.note};state.done=true;draw()}catch(e){toast(e.message);submit.disabled=false}}};draw()}
boot();
</script></body></html>
