<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>음료 주문 웹앱</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;color:#111827;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}.wrap{max-width:980px;margin:auto;padding:24px 14px 70px}.narrow{max-width:560px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 8px 26px #0f172a0b;margin-bottom:14px}.brand{font-size:12px;font-weight:900;letter-spacing:.12em;color:#4b5563}h1{font-size:27px;margin:4px 0 6px;letter-spacing:-.04em}h2{font-size:19px;margin:0 0 12px}.muted{color:#6b7280;font-size:14px}.field{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field:focus{border-color:#111827;box-shadow:0 0 0 3px #11182712}label{display:block;font-size:14px;font-weight:800;margin:14px 0 7px}textarea.field{min-height:92px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:850;cursor:pointer;background:#f3f4f6;color:#111827}.btn.primary{background:#111827;color:#fff}.btn.danger{background:#fff1f2;color:#be123c}.btn:disabled{opacity:.45;cursor:not-allowed}.full{width:100%;margin-top:16px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900}.open{background:#ecfdf5;color:#047857}.closed{background:#f3f4f6;color:#4b5563}.notice{padding:11px 12px;border-radius:12px;background:#eef2ff;color:#3730a3;font-size:14px;margin:12px 0}.error{background:#fff1f2;color:#be123c}.ok{background:#ecfdf5;color:#047857}.rooms{display:grid;gap:10px}.room{border:1px solid #e5e7eb;border-radius:14px;padding:14px;background:#fff}.share{display:flex;gap:8px}.share input{flex:1;min-width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.stat small{color:#6b7280}.stat strong{display:block;font-size:24px;margin-top:2px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.line{padding:10px 0;border-bottom:1px solid #eee}.line:last-child{border-bottom:0}.summary{white-space:pre-wrap;background:#111827;color:#fff;padding:15px;border-radius:13px;line-height:1.65;font-size:14px}.temps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.temps button{border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:12px;font-weight:900}.temps button.on{background:#111827;color:#fff;border-color:#111827}.step{display:flex;gap:9px;margin-bottom:10px}.num{width:27px;height:27px;border-radius:8px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.complete{text-align:center;padding:20px 0}.complete .check{font-size:46px}.back{text-decoration:none;color:#6b7280;font-weight:800;font-size:14px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;transition:.2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:720px){.wrap{padding:16px 11px 60px}.grid2,.stats{grid-template-columns:1fr}.share{flex-direction:column}.share .btn{width:100%}.row.mobile{align-items:flex-start;flex-direction:column}.actions.mobile{width:100%}.actions.mobile .btn{flex:1}h1{font-size:23px}}
</style>
</head>
<body>
<div id="app"><div class="wrap narrow"><div class="card">불러오는 중...</div></div></div><div id="toast" class="toast"></div>
<script>
const SB='https://ewlimstjrleofteykqtm.supabase.co',KEY='sb_publishable_vb6Xgiw1b8ujrGzkKrvq5g_9RQlHqQr',ROOMS_KEY='drink-order-rooms-v1';
const app=document.getElementById('app'),toastEl=document.getElementById('toast');let toastTimer;
const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){clearTimeout(toastTimer);toastEl.textContent=s;toastEl.classList.add('show');toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800)}
async function rpc(name,body={}){const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,authorization:`Bearer ${KEY}`,'content-type':'application/json'},body:JSON.stringify(body)});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||'처리 중 오류가 발생했습니다.');return d}
async function copy(s){try{await navigator.clipboard.writeText(s)}catch{const x=document.createElement('textarea');x.value=s;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('복사했습니다.')}
function base(){return location.origin+location.pathname}
function dt(v){if(!v)return'';return new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v))}
function localDT(v){if(!v)return'';const d=new Date(v);const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}
function rooms(){try{return JSON.parse(localStorage.getItem(ROOMS_KEY)||'[]')}catch{return[]}}
function saveRoom(r){const a=rooms().filter(x=>x.admin_token!==r.admin_token);a.unshift(r);localStorage.setItem(ROOMS_KEY,JSON.stringify(a.slice(0,30)))}
function removeSaved(token){localStorage.setItem(ROOMS_KEY,JSON.stringify(rooms().filter(x=>x.admin_token!==token)))}
function route(){const q=new URLSearchParams(location.search);if(q.get('order'))return['order',q.get('order')];if(q.get('admin'))return['admin',q.get('admin')];return['home','']}
function go(q=''){location.href=base()+q}

async function home(){const saved=rooms();app.innerHTML=`<main class="wrap"><div class="brand">DRINK ORDER</div><h1>음료 주문 웹앱</h1><p class="muted">카페와 상관없이 사용할 수 있는 간단한 음료 주문 취합 도구입니다. 회원가입 없이 주문방을 만들고 링크만 공유하세요.</p><div class="grid2"><section class="card"><h2>새 주문방 만들기</h2><form id="create"><label>주문 제목</label><input id="title" class="field" value="음료 주문" maxlength="80" required><label>마감 시간 <span class="muted" style="font-weight:400">(선택)</span></label><input id="deadline" type="datetime-local" class="field"><button class="btn primary full">주문방 만들기</button></form><div class="notice">주문방을 만들면 <b>취합자용 링크</b>와 <b>주문자용 링크</b>가 각각 생성됩니다. 취합자용 링크는 다른 사람에게 공유하지 마세요.</div></section><section><h2>이 기기에서 만든 주문방</h2><div class="rooms">${saved.length?saved.map(r=>`<article class="room"><div class="row between"><b>${esc(r.title||'음료 주문')}</b><button class="btn" data-open="${esc(r.admin_token)}">관리</button></div><div class="muted" style="margin-top:5px">${r.created_at?dt(r.created_at):''}</div></article>`).join(''):'<div class="card muted">아직 만든 주문방이 없습니다.</div>'}</div></section></div></main>`;
create.onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const d=await rpc('coffee_create_room_simple',{p_title:title.value.trim(),p_deadline:deadline.value?new Date(deadline.value).toISOString():null});saveRoom({...d,created_at:new Date().toISOString()});go(`?admin=${d.admin_token}`)}catch(x){toast(x.message);b.disabled=false}};
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(`?admin=${b.dataset.open}`));}

async function admin(token){let d;try{d=await rpc('coffee_admin_data_simple',{p_admin_token:token})}catch(e){app.innerHTML=`<main class="wrap narrow"><section class="card"><h2>취합자 페이지를 열 수 없습니다.</h2><div class="notice error">${esc(e.message)}</div><button class="btn" onclick="go()">처음으로</button></section></main>`;return}const m=d.meeting,o=d.orders||[];saveRoom({admin_token:token,public_token:m.public_token,title:m.title,created_at:m.created_at});
const groups=new Map;for(const x of o){const temp=x.temperature==='NONE'?'':x.temperature;const k=x.menu_name+'|'+temp;if(!groups.has(k))groups.set(k,{name:x.menu_name,temp,n:0});groups.get(k).n++}const g=[...groups.values()];const publicLink=`${base()}?order=${m.public_token}`,adminLink=`${base()}?admin=${token}`;const lines=[m.title,''];g.forEach(x=>lines.push(`${x.name}${x.temp?' '+x.temp:''} × ${x.n}`));const notes=o.filter(x=>x.note);if(notes.length){lines.push('','[추가 요구사항]');notes.forEach(x=>lines.push(`${x.customer_name} - ${x.menu_name}: ${x.note}`))}lines.push('',`총 ${o.length}잔`);const text=lines.join('\n');
app.innerHTML=`<main class="wrap"><a class="back" href="${base()}">← 처음으로</a><div class="row between mobile" style="margin-top:12px"><div><div class="brand">COLLECTOR</div><h1>${esc(m.title)}</h1><span class="badge ${m.status==='open'?'open':'closed'}">${m.status==='open'?'주문 접수중':'주문 마감'}</span>${m.deadline?` <span class="muted">· ${esc(dt(m.deadline))} 마감</span>`:''}</div><div class="actions mobile"><button id="refresh" class="btn">새로고침</button><button id="copyOrder" class="btn primary">주문복사</button><button id="toggle" class="btn ${m.status==='open'?'danger':''}">${m.status==='open'?'주문 마감':'주문 다시 열기'}</button></div></div><div class="stats"><div class="stat"><small>총 주문</small><strong>${o.length}잔</strong></div><div class="stat"><small>메뉴 종류</small><strong>${g.length}종</strong></div><div class="stat"><small>상태</small><strong>${m.status==='open'?'접수중':'마감'}</strong></div></div><section class="card"><h2>주문자에게 보낼 링크</h2><div class="share"><input class="field" readonly value="${esc(publicLink)}"><button id="copyPublic" class="btn primary">링크 복사</button><a class="btn" href="${esc(publicLink)}" target="_blank" style="text-decoration:none;text-align:center">주문 페이지 열기</a></div></section><section class="card"><h2>취합자용 링크</h2><div class="share"><input class="field" readonly value="${esc(adminLink)}"><button id="copyAdmin" class="btn">취합자 링크 복사</button></div><div class="muted" style="margin-top:8px">이 링크를 가진 사람은 주문 내역을 관리할 수 있습니다.</div></section><section class="card"><h2>주문방 설정</h2><form id="settings"><div class="grid2"><div><label>제목</label><input id="setTitle" class="field" value="${esc(m.title)}"></div><div><label>마감 시간</label><input id="setDeadline" type="datetime-local" class="field" value="${esc(localDT(m.deadline))}"></div></div><button class="btn primary" style="margin-top:12px">저장</button></form></section><div class="grid2"><section class="card"><h2>메뉴별 취합</h2>${g.length?g.map(x=>`<div class="line row between"><b>${esc(x.name)}${x.temp?' '+esc(x.temp):''}</b><strong>${x.n}잔</strong></div>`).join(''):'<div class="muted">아직 주문이 없습니다.</div>'}</section><section class="card"><h2>사람별 주문</h2>${o.length?o.map(x=>`<div class="line"><div class="row between"><b>${esc(x.customer_name)}</b><button class="btn danger" data-del="${x.id}" style="padding:6px 9px;font-size:12px">삭제</button></div><div>${esc(x.menu_name)}${x.temperature==='NONE'?'':' · '+esc(x.temperature)}</div>${x.note?`<div class="muted">요청: ${esc(x.note)}</div>`:''}</div>`).join(''):'<div class="muted">아직 주문이 없습니다.</div>'}</section></div><section class="card"><h2>카페 전달용 주문내용</h2><div class="summary">${esc(text)}</div></section><section class="card"><button id="deleteRoom" class="btn danger">이 주문방 삭제</button></section></main>`;
refresh.onclick=()=>location.reload();copyOrder.onclick=()=>copy(text);copyPublic.onclick=()=>copy(publicLink);copyAdmin.onclick=()=>copy(adminLink);toggle.onclick=async()=>{try{await rpc('coffee_admin_set_status',{p_admin_token:token,p_status:m.status==='open'?'closed':'open'});location.reload()}catch(e){toast(e.message)}};settings.onsubmit=async e=>{e.preventDefault();try{await rpc('coffee_admin_update_room_simple',{p_admin_token:token,p_title:setTitle.value.trim(),p_deadline:setDeadline.value?new Date(setDeadline.value).toISOString():null});toast('저장했습니다.');setTimeout(()=>location.reload(),500)}catch(x){toast(x.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('이 주문을 삭제할까요?'))return;try{await rpc('coffee_admin_delete_order',{p_admin_token:token,p_order_id:b.dataset.del});location.reload()}catch(x){toast(x.message)}});deleteRoom.onclick=async()=>{if(!confirm('주문방과 모든 주문을 삭제할까요?'))return;try{await rpc('coffee_admin_delete_room_simple',{p_admin_token:token});removeSaved(token);go()}catch(x){toast(x.message)}};}

async function order(token){let p;try{p=await rpc('coffee_public_get_order_page_v4',{p_public_token:token})}catch(e){app.innerHTML=`<main class="wrap narrow"><section class="card"><h2>주문 페이지를 열 수 없습니다.</h2><div class="notice error">${esc(e.message)}</div></section></main>`;return}const m=p.meeting,store='drink-order-'+token;let old=localStorage.getItem(store),mine=null;if(old)try{mine=await rpc('coffee_public_get_my_order_v4',{p_public_token:token,p_order_token:old});if(!mine){old=null;localStorage.removeItem(store)}}catch{old=null;localStorage.removeItem(store)}let state={name:mine?.customer_name||'',menu:mine?.menu_name||'',temp:mine?.temperature==='ICED'?'ICE':mine?.temperature||'',note:mine?.note||'',done:false,busy:false};const closed=m.status!=='open'||(m.deadline&&Date.now()>new Date(m.deadline).getTime());function draw(){if(state.done){app.innerHTML=`<main class="wrap narrow"><div class="brand">DRINK ORDER</div><h1>${esc(m.title)}</h1><section class="card complete"><div class="check">✓</div><h2>${mine?'주문이 수정되었습니다':'주문이 접수되었습니다'}</h2><p class="muted">${esc(state.name)}님의 주문을 저장했습니다.</p><button id="edit" class="btn primary">내 주문 수정하기</button></section></main>`;edit.onclick=()=>{state.done=false;draw()};return}app.innerHTML=`<main class="wrap narrow"><div class="brand">DRINK ORDER</div><h1>${esc(m.title)}</h1><p class="muted">원하는 카페의 메뉴판을 보고 음료 이름을 직접 입력하세요.${m.deadline?` · 마감 ${esc(dt(m.deadline))}`:''}</p><span class="badge ${closed?'closed':'open'}">${closed?'주문 마감':'주문 접수중'}</span>${mine?'<div class="notice">이 기기의 기존 주문이 있습니다. 다시 제출하면 기존 주문이 수정됩니다.</div>':''}${closed?'<div class="notice error">현재 주문이 마감되었습니다.</div>':''}<section class="card"><div class="step"><span class="num">1</span><div><b>이름</b><div class="muted">주문자 이름을 입력하세요.</div></div></div><input id="name" class="field" maxlength="30" value="${esc(state.name)}" ${closed?'disabled':''}></section><section class="card"><div class="step"><span class="num">2</span><div><b>음료 작성</b><div class="muted">카페 메뉴 이름을 그대로 적어주세요.</div></div></div><input id="menu" class="field" maxlength="80" placeholder="예: 바닐라라떼, 딸기요거트스무디" value="${esc(state.menu)}" ${closed?'disabled':''}></section><section class="card"><div class="step"><span class="num">3</span><div><b>온도 선택</b><div class="muted">해당되는 항목을 선택하세요.</div></div></div><div class="temps"><button data-temp="HOT" class="${state.temp==='HOT'?'on':''}" ${closed?'disabled':''}>HOT</button><button data-temp="ICE" class="${state.temp==='ICE'||state.temp==='ICED'?'on':''}" ${closed?'disabled':''}>ICED</button><button data-temp="NONE" class="${state.temp==='NONE'?'on':''}" ${closed?'disabled':''}>해당 없음</button></div></section><section class="card"><div class="step"><span class="num">4</span><div><b>추가 요구사항 <span class="muted">(선택)</span></b><div class="muted">연하게, 덜 달게, 얼음 적게, 샷 추가 등</div></div></div><textarea id="note" class="field" maxlength="200" placeholder="예: 덜 달게, 얼음 적게" ${closed?'disabled':''}>${esc(state.note)}</textarea></section><button id="submit" class="btn primary full" ${closed?'disabled':''}>${mine?'주문 수정하기':'주문하기'}</button></main>`;name.oninput=e=>state.name=e.target.value;menu.oninput=e=>state.menu=e.target.value;note.oninput=e=>state.note=e.target.value;document.querySelectorAll('[data-temp]').forEach(b=>b.onclick=()=>{state.temp=b.dataset.temp;draw()});submit.onclick=async()=>{if(!state.name.trim()){toast('이름을 입력해 주세요.');return}if(!state.menu.trim()){toast('음료 이름을 입력해 주세요.');return}if(!state.temp){toast('온도를 선택해 주세요.');return}submit.disabled=true;try{const r=await rpc('coffee_public_submit_order_v4',{p_public_token:token,p_customer_name:state.name.trim(),p_menu_name:state.menu.trim(),p_temperature:state.temp,p_note:state.note.trim(),p_order_token:old||null});old=r.order_token;localStorage.setItem(store,old);mine={customer_name:state.name,menu_name:state.menu,temperature:state.temp,note:state.note};state.done=true;draw()}catch(e){toast(e.message);submit.disabled=false}}}draw()}

(async()=>{const[r,v]=route();if(r==='order')await order(v);else if(r==='admin')await admin(v);else await home()})().catch(e=>{app.innerHTML=`<main class="wrap narrow"><section class="card"><h2>오류</h2><div class="notice error">${esc(e.message)}</div></section></main>`});
</script>
</body>
</html>
