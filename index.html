<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>음료 주문 취합</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;color:#111827;background:#f4f5f7}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}.wrap{max-width:1060px;margin:auto;padding:24px 14px 60px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;box-shadow:0 7px 28px #0f172a0a}.auth,.orderbox{max-width:500px;margin:5vh auto}.hidden{display:none!important}h1{font-size:25px;margin:0 0 6px}h2{font-size:19px;margin:0}.muted{color:#6b7280}.field{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field:focus{border-color:#111827;box-shadow:0 0 0 3px #11182712}label{display:block;font-size:14px;font-weight:800;margin:14px 0 7px}textarea.field{min-height:86px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff}.ghost{background:#f3f4f6}.danger{background:#fff1f2;color:#be123c}.good{background:#ecfdf5;color:#047857}.full{width:100%;margin-top:16px}.tabs,.temps{display:flex;gap:4px;background:#f3f4f6;border-radius:12px;padding:4px}.tabs button,.temps button{flex:1;border:0;background:transparent;border-radius:9px;padding:10px;font-weight:800;cursor:pointer}.tabs .on,.temps .on{background:#fff;box-shadow:0 1px 5px #0002}.msg{padding:11px 12px;border-radius:11px;margin:12px 0;font-size:14px;background:#fff1f2;color:#be123c}.msg.ok{background:#ecfdf5;color:#047857}.top,.row{display:flex;align-items:center;gap:9px}.top{justify-content:space-between;margin-bottom:18px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:330px 1fr;gap:18px}.stack{display:grid;gap:12px}.room{border:1px solid #e5e7eb;border-radius:13px;padding:13px;cursor:pointer}.room:hover,.room.on{border-color:#111827;background:#f9fafb}.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.badge.open{background:#ecfdf5;color:#047857}.badge.closed{background:#f3f4f6;color:#4b5563}.share{display:flex;gap:8px}.share input{flex:1;min-width:0}.count{font-size:32px;font-weight:900}.orders{display:grid;gap:8px;margin-top:14px}.order{display:grid;grid-template-columns:110px 1.2fr 70px 1.4fr auto;gap:9px;align-items:center;border:1px solid #e5e7eb;border-radius:12px;padding:11px}.head{font-size:12px;color:#6b7280;background:#f9fafb}.hot{color:#b45309;font-weight:900}.ice{color:#0369a1;font-weight:900}.empty{text-align:center;color:#6b7280;padding:30px 8px}.summary{background:#f9fafb;border-radius:13px;padding:14px;margin-top:14px;line-height:1.7}@media(max-width:800px){.wrap{padding:14px 11px 40px}.grid{grid-template-columns:1fr}.top h1{font-size:21px}.order.head{display:none}.order{grid-template-columns:1fr auto}.order .menu,.order .note{grid-column:1/-1}.order .del{grid-row:1;grid-column:2}.share{flex-direction:column}.share .btn{width:100%}}</style></head><body><div class="wrap"><section id="orderView" class="hidden"><div class="card orderbox"><div style="font-size:38px">☕</div><h1 id="oTitle">음료 주문</h1><div id="oDeadline" class="muted"></div><div id="oMsg"></div><form id="orderForm"><label>이름</label><input id="oName" class="field" maxlength="30" placeholder="이름을 입력하세요" required><label>음료 메뉴</label><input id="oMenu" class="field" maxlength="80" placeholder="예: 아메리카노" required><label>HOT / ICE</label><div class="temps"><button id="hot" type="button">HOT</button><button id="ice" type="button">ICE</button></div><label>세부 요청사항 <span class="muted" style="font-weight:400">(선택)</span></label><textarea id="oNote" class="field" maxlength="200" placeholder="예: 얼음 적게, 샷 추가"></textarea><button id="orderSubmit" class="btn primary full">주문 제출</button></form><div id="oSummary"></div></div></section><section id="auth" class="card auth hidden"><h1>☕ 음료 주문 취합</h1><p class="muted">취합자만 로그인합니다. 주문자는 공유 링크로 바로 주문합니다.</p><div class="tabs"><button id="loginTab" class="on">로그인</button><button id="signupTab">회원가입</button></div><div id="authMsg"></div><form id="loginForm"><label>아이디</label><input id="loginUser" class="field" required><label>비밀번호</label><input id="loginPass" class="field" type="password" required><button class="btn primary full">로그인</button></form><form id="signupForm" class="hidden"><label>표시 이름</label><input id="signupName" class="field" maxlength="30" placeholder="예: 홍길동"><label>아이디</label><input id="signupUser" class="field" maxlength="30" required><label>비밀번호</label><input id="signupPass" class="field" type="password" minlength="6" required><button class="btn primary full">회원가입</button></form></section><section id="admin" class="hidden"><div class="top"><div><h1>☕ 음료 주문 취합</h1><div id="hello" class="muted"></div></div><button id="logout" class="btn ghost">로그아웃</button></div><div class="grid"><div class="stack"><div class="card"><h2>새 주문방</h2><form id="newRoom"><label>주문 제목</label><input id="roomTitle" class="field" maxlength="80" placeholder="예: 8월 12일 음료 주문" required><label>마감시간 <span class="muted" style="font-weight:400">(선택)</span></label><input id="deadline" class="field" type="datetime-local"><button class="btn primary full">주문방 만들기</button></form></div><div class="card"><div class="row between"><h2>내 주문방</h2><button id="roomsRefresh" class="btn ghost">새로고침</button></div><div id="rooms" class="stack" style="margin-top:13px"></div></div></div><div id="detail" class="card"><div class="empty">주문방을 선택하세요.</div></div></div></section></div><script>const SB='https://ewlimstjrleofteykqtm.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYXNlIiwicmVmIjoiZXdsaW1zdGpybGVvZnRleWtxdG0iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc4NjI3OTQ2NSwiZXhwIjoyMTAxODU1NDY1fQ.Rkf1IN2bs2MIOIZUKmjEkygZZbKlMXo7eesSri5rmX8',SK='coffee_admin_session_v4';let session=localStorage.getItem(SK)||'',current=null,timer=null,temp='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(n,b){const r=await fetch(`${SB}/rest/v1/rpc/${n}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||String(d)||'요청 실패');return d}function message(el,t,ok=false){el.innerHTML=t?`<div class="msg ${ok?'ok':''}">${esc(t)}</div>`:''}const token=new URLSearchParams(location.search).get('order');token?publicBoot(token):adminBoot();async function publicBoot(t){$('#orderView').classList.remove('hidden');try{const d=await rpc('coffee_public_get_order_page_v4',{p_public_token:t}),m=d.meeting;$('#oTitle').textContent=m.title;document.title=m.title;$('#oDeadline').textContent=m.deadline?'마감: '+new Date(m.deadline).toLocaleString('ko-KR'):'마감시간 없음';if(m.status!=='open'||(m.deadline&&Date.now()>new Date(m.deadline).getTime())){message($('#oMsg'),'주문이 마감되었습니다.');disable();return}const saved=localStorage.getItem('order_'+t);if(saved){try{const mine=await rpc('coffee_public_get_my_order_v4',{p_public_token:t,p_order_token:saved});if(mine){$('#oName').value=mine.customer_name;$('#oMenu').value=mine.menu_name;$('#oNote').value=mine.note||'';setTemp(mine.temperature);summary(mine,true)}}catch{}}$('#hot').onclick=()=>setTemp('HOT');$('#ice').onclick=()=>setTemp('ICE');$('#orderForm').onsubmit=e=>submitOrder(e,t)}catch(e){message($('#oMsg'),e.message);disable()}}function disable(){document.querySelectorAll('#orderForm input,#orderForm textarea,#orderForm button').forEach(x=>x.disabled=true)}function setTemp(v){temp=v;$('#hot').classList.toggle('on',v==='HOT');$('#ice').classList.toggle('on',v==='ICE')}async function submitOrder(e,t){e.preventDefault();if(!temp){message($('#oMsg'),'HOT 또는 ICE를 선택해 주세요.');return}const b=$('#orderSubmit');b.disabled=true;try{const old=localStorage.getItem('order_'+t),d=await rpc('coffee_public_submit_order_v4',{p_public_token:t,p_customer_name:$('#oName').value,p_menu_name:$('#oMenu').value,p_temperature:temp,p_note:$('#oNote').value,p_order_token:old||null});localStorage.setItem('order_'+t,d.order_token);message($('#oMsg'),old?'주문이 수정되었습니다.':'주문이 접수되었습니다.',true);summary({customer_name:$('#oName').value,menu_name:$('#oMenu').value,temperature:temp,note:$('#oNote').value},false)}catch(e){message($('#oMsg'),e.message)}finally{b.disabled=false}}function summary(o,existing){$('#oSummary').innerHTML=`<div class="summary"><b>${existing?'내 주문':'주문 완료'}</b><br>${esc(o.customer_name)} · ${esc(o.menu_name)} · <b>${esc(o.temperature)}</b>${o.note?'<br>요청: '+esc(o.note):''}<div class="muted" style="font-size:13px;margin-top:5px">내용을 바꾸고 다시 누르면 기존 주문이 수정됩니다.</div></div>`;$('#orderSubmit').textContent='주문 수정하기'}function adminBoot(){$('#auth').classList.remove('hidden');$('#loginTab').onclick=()=>tab(false);$('#signupTab').onclick=()=>tab(true);$('#loginForm').onsubmit=login;$('#signupForm').onsubmit=signup;$('#logout').onclick=logout;$('#newRoom').onsubmit=createRoom;$('#roomsRefresh').onclick=()=>loadRooms(current?.id);if(session)start()}function tab(s){$('#loginTab').classList.toggle('on',!s);$('#signupTab').classList.toggle('on',s);$('#loginForm').classList.toggle('hidden',s);$('#signupForm').classList.toggle('hidden',!s);message($('#authMsg'),'')}async function login(e){e.preventDefault();try{const d=await rpc('coffee_admin_login',{p_username:$('#loginUser').value,p_password:$('#loginPass').value});session=d.session_token;localStorage.setItem(SK,session);start()}catch(e){message($('#authMsg'),e.message)}}async function signup(e){e.preventDefault();try{const d=await rpc('coffee_admin_signup',{p_username:$('#signupUser').value,p_password:$('#signupPass').value,p_display_name:$('#signupName').value});session=d.session_token;localStorage.setItem(SK,session);start()}catch(e){message($('#authMsg'),e.message)}}async function logout(){try{await rpc('coffee_admin_logout',{p_session_token:session})}catch{}localStorage.removeItem(SK);location.reload()}async function start(){try{const me=await rpc('coffee_admin_me',{p_session_token:session});$('#hello').textContent=me.display_name+'님의 주문방';$('#auth').classList.add('hidden');$('#admin').classList.remove('hidden');await loadRooms()}catch{localStorage.removeItem(SK);session='';$('#auth').classList.remove('hidden');$('#admin').classList.add('hidden')}}async function createRoom(e){e.preventDefault();const b=e.submitter;b.disabled=true;try{const dl=$('#deadline').value?new Date($('#deadline').value).toISOString():null,d=await rpc('coffee_admin_create_meeting_v4',{p_session_token:session,p_title:$('#roomTitle').value,p_deadline:dl});$('#roomTitle').value='';$('#deadline').value='';await loadRooms(d.id)}catch(e){alert(e.message)}finally{b.disabled=false}}async function loadRooms(select){const list=await rpc('coffee_admin_list_meetings_v3',{p_session_token:session}),el=$('#rooms');if(!list.length){el.innerHTML='<div class="empty">아직 주문방이 없습니다.</div>';$('#detail').innerHTML='<div class="empty">새 주문방을 만들어 보세요.</div>';return}el.innerHTML=list.map(r=>`<div class="room ${current?.id===r.id?'on':''}" data-id="${r.id}"><div class="row between"><b>${esc(r.title)}</b><span class="badge ${r.status==='open'?'open':'closed'}">${r.status==='open'?'주문중':'마감'}</span></div><div class="muted" style="margin-top:6px">주문 ${r.order_count}명${r.deadline?' · '+new Date(r.deadline).toLocaleString('ko-KR'):''}</div></div>`).join('');el.querySelectorAll('.room').forEach(x=>x.onclick=()=>openRoom(x.dataset.id));if(select)await openRoom(select);else if(current)await openRoom(current.id)}async function openRoom(id){try{const d=await rpc('coffee_admin_dashboard_v4',{p_session_token:session,p_meeting_id:id});current=d.meeting;drawDetail(d);document.querySelectorAll('.room').forEach(x=>x.classList.toggle('on',x.dataset.id===id));clearInterval(timer);timer=setInterval(()=>refreshRoom(id),5000)}catch(e){alert(e.message)}}async function refreshRoom(id){if(current?.id!==id)return;try{const d=await rpc('coffee_admin_dashboard_v4',{p_session_token:session,p_meeting_id:id});current=d.meeting;drawDetail(d)}catch{}}function drawDetail(d){const m=d.meeting,o=d.orders||[],base=location.origin+location.pathname,link=base+'?order='+m.public_token;$('#detail').innerHTML=`<div class="row between"><div><div class="row"><h2>${esc(m.title)}</h2><span class="badge ${m.status==='open'?'open':'closed'}">${m.status==='open'?'주문중':'마감'}</span></div><div class="muted" style="margin-top:6px">${m.deadline?'마감 '+new Date(m.deadline).toLocaleString('ko-KR'):'마감시간 없음'}</div></div><div class="count">${o.length}<span style="font-size:14px">명</span></div></div><label>주문자 공유 링크</label><div class="share"><input id="shareLink" class="field" readonly value="${esc(link)}"><button id="copy" class="btn primary">링크 복사</button></div><div class="row" style="margin-top:11px"><button id="status" class="btn ${m.status==='open'?'danger':'good'}">${m.status==='open'?'주문 마감':'다시 열기'}</button><button id="refresh" class="btn ghost">새로고침</button><button id="deleteRoom" class="btn ghost">주문방 삭제</button></div><div class="orders">${o.length?'<div class="order head"><span>이름</span><span>음료 메뉴</span><span>HOT/ICE</span><span>세부 요청사항</span><span></span></div>':''}${o.map(x=>`<div class="order"><span><b>${esc(x.customer_name)}</b></span><span class="menu">${esc(x.menu_name)}</span><span class="${x.temperature==='HOT'?'hot':'ice'}">${x.temperature==='HOT'?'HOT':'ICE'}</span><span class="note">${esc(x.note||'-')}</span><button class="btn ghost del" data-order="${x.id}">삭제</button></div>`).join('')}${o.length?'':'<div class="empty">아직 들어온 주문이 없습니다.</div>'}</div>`;$('#copy').onclick=()=>copy(link);$('#refresh').onclick=()=>openRoom(m.id);$('#status').onclick=()=>toggle(m);$('#deleteRoom').onclick=()=>removeRoom(m);document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>removeOrder(m.id,b.dataset.order))}async function copy(t){try{await navigator.clipboard.writeText(t)}catch{$('#shareLink').select();document.execCommand('copy')}alert('공유 링크를 복사했습니다.')}async function toggle(m){try{await rpc('coffee_admin_set_status_v3',{p_session_token:session,p_meeting_id:m.id,p_status:m.status==='open'?'closed':'open'});await openRoom(m.id);await loadRooms()}catch(e){alert(e.message)}}async function removeOrder(mid,oid){if(!confirm('이 주문을 삭제할까요?'))return;try{await rpc('coffee_admin_delete_order_v3',{p_session_token:session,p_meeting_id:mid,p_order_id:oid});await openRoom(mid);await loadRooms()}catch(e){alert(e.message)}}async function removeRoom(m){if(!confirm('주문방과 주문 내역을 모두 삭제할까요?'))return;try{await rpc('coffee_admin_delete_meeting_v3',{p_session_token:session,p_meeting_id:m.id});current=null;clearInterval(timer);await loadRooms()}catch(e){alert(e.message)}}</script></body></html>
